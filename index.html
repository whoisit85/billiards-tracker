<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🎱 Billiards Score Tracker</title>
        <style>
            :root {
                --bg: #07111f;
                --bg-alt: #101e3f;
                --panel: rgba(18, 32, 79, 0.95);
                --panel-alt: rgba(16, 28, 56, 0.92);
                --text: #eef2ff;
                --muted: #9fb1d2;
                --accent: #3cd390;
                --accent-soft: rgba(60, 211, 144, 0.16);
                --danger: #ff4f6f;
                --danger-soft: rgba(255, 79, 111, 0.15);
                --border: rgba(255,255,255,0.08);
                --shadow: 0 18px 35px rgba(0,0,0,0.35);
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
                color: var(--text);
                background: radial-gradient(circle at top, rgba(85, 128, 255, 0.14), transparent 28%),
                            radial-gradient(circle at 20% 10%, rgba(65, 36, 146, 0.22), transparent 18%),
                            linear-gradient(180deg, #070f1a 0%, #0d1f3b 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1.25rem;
            }
            .board {
                width: min(100%, 700px);
                max-width: 100%;
                background: linear-gradient(180deg, rgba(10,18,36,0.96), rgba(16,28,56,0.95));
                border: 1px solid rgba(255,255,255,0.08);
                border-radius: 24px;
                padding: 1rem;
                box-shadow: var(--shadow);
                backdrop-filter: blur(12px);
            }
            .head { text-align: center; margin-bottom: 0.8rem; }
            .head h1 { margin: 0.2rem 0; font-size: 1.4rem; }
            .head p { margin: 0; color: #b4b8cc; }
            .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .6rem; }
            .player-card {
                background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
                border: 1px solid rgba(255,255,255,0.08);
                border-radius: 22px;
                padding: 0.85rem;
                min-height: 150px;
                position: relative;
                box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 18px 36px rgba(0,0,0,0.22);
                backdrop-filter: blur(6px);
            }
            .player-card h1 {
                margin: 0;
                font-size: 1rem;
                font-weight: 800;
                letter-spacing: 0.02em;
                color: var(--text);
                text-transform: none;
            }
            .player-header {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 0.65rem;
                margin-bottom: 1rem;
            }
            .player-header h1 {
                flex: 1;
                text-align: center;
            }
            .edit-btn {
                position: static;
                margin: 0;
                background: rgba(255,255,255,0.08);
                color: var(--muted);
                width: 40px;
                height: 40px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 14px;
            }
            .player-card input {
                width: 100%;
                padding: 0.75rem 0.9rem;
                border-radius: 14px;
                border: 1px solid rgba(255,255,255,0.08);
                background: rgba(255,255,255,0.06);
                color: var(--text);
            }
            .score {
                margin: 0.8rem 0;
                font-size: 1.15rem;
                font-weight: 700;
                text-align: center;
            }
            .score-value {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                padding: 1rem;
                border-radius: 18px;
                border: 1px solid rgba(255,255,255,0.12);
                background: linear-gradient(135deg, rgba(59,130,246,0.92), rgba(29,78,216,0.95));
                box-shadow: 0 18px 35px rgba(14,45,107,0.35);
                width: 100%;
                min-height: 68px;
            }
            .match-player-score {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                min-width: 0;
                font-weight: 800;
            }
            .match-player-score strong { font-size: 1.5rem; }
            .match-player-score span {
                max-width: 12rem;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: rgba(255,255,255,0.88);
                font-size: 0.95rem;
            }
            .player-count-controls {
                display: flex;
                justify-content: center;
                gap: 0.65rem;
                margin-top: 0.65rem;
            }
            .player-count-controls button {
                border: 0;
                border-radius: 12px;
                padding: 0.65rem 1rem;
                color: #fff;
                background: rgba(96, 117, 170, 0.95);
                font-weight: 700;
                cursor: pointer;
            }
            .player-count-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
            .fullscreen-player-scores {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.75rem;
                width: 100%;
                margin-bottom: 0.9rem;
            }
            .fullscreen-player-score {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.5rem;
                padding: 0.7rem 0.85rem;
                border-radius: 14px;
                background: rgba(255,255,255,0.07);
                color: #d7def8;
            }
            .fullscreen-player-score span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .fullscreen-player-score strong { font-size: 1.8rem; color: #fff; }
            .control-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
            .control-row button {
                height: 38px;
                padding: 0 0.5rem;
                border: none;
                border-radius: 12px;
                color: #fff;
                background: #3c5bd6;
                font-size: 0.88rem;
                font-weight: 700;
                cursor: pointer;
                min-width: 0;
                transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
                box-shadow: 0 10px 14px rgba(18, 32, 72, 0.18);
            }
            .control-row button:hover { transform: translateY(-1px); }
            .control-row button.secondary { background: rgba(96, 117, 170, 0.95); }
            .control-row button.danger { background: var(--danger); }
            .control-row button.accent { background: var(--accent); }
            .status {
                text-align: center;
                margin: 1rem 0;
                padding: 0.9rem 1rem;
                border-radius: 18px;
                background: rgba(60,211,144,0.1);
                color: #d8ffe8;
                min-height: 1.75rem;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
            }
            .full-controls {
                margin-top: 1rem;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.65rem;
            }
            .full-controls button {
                width: 100%;
                padding: 0.95rem 0.5rem;
                border: none;
                border-radius: 18px;
                color: #fff;
                background: var(--danger);
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 18px 28px rgba(255,79,111,0.22);
                transition: transform 0.2s ease, filter 0.2s ease;
            }
            .full-controls button.secondary {
                background: rgba(96, 117, 170, 0.95);
                box-shadow: 0 14px 20px rgba(12, 30, 62, 0.22);
            }
            .full-controls button:hover { transform: translateY(-1px); filter: brightness(1.05); }
            .settings > div { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
            .settings label {
                margin-bottom: 0;
                font-size: 0.95rem;
                color: var(--text);
                letter-spacing: 0.01em;
            }
            .settings select, .settings input {
                font-size: 0.95rem;
                color: var(--text);
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.08);
                border-radius: 14px;
                padding: 0.75rem 0.9rem;
            }
            .lang-switcher {
                display: flex;
                gap: 0.55rem;
                flex-wrap: wrap;
                align-items: center;
            }
            .lang-switcher button {
                border: 1px solid rgba(255,255,255,0.12);
                background: rgba(255,255,255,0.06);
                color: var(--text);
                border-radius: 14px;
                padding: 0.65rem 0.9rem;
                cursor: pointer;
                min-width: 110px;
                font-weight: 700;
                transition: background 0.2s ease, transform 0.2s ease;
            }
            .lang-switcher button:hover {
                background: rgba(255,255,255,0.12);
            }
            .lang-switcher button.active {
                background: rgba(60, 211, 144, 0.18);
                border-color: rgba(60, 211, 144, 0.4);
                transform: translateY(-1px);
            }
            .fullscreen-score { display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: rgba(2, 10, 26, 0.98); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; gap: 0; cursor: pointer; padding: 0; margin: 0; overflow: hidden; }
            .fullscreen-score.active { display: flex; }
            .fullscreen-score-display { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; width: min(100%, 560px); max-width: 96vw; min-height: 52vh; max-height: min(100%, calc(100vh - 2rem)); padding: 2rem 1.2rem; box-sizing: border-box; margin: auto; overflow: hidden; background: rgba(8, 16, 38, 0.98); border: 1px solid rgba(255,255,255,0.14); border-radius: 28px; box-shadow: 0 32px 72px rgba(0,0,0,0.42); }
            .fullscreen-game-label { margin-bottom: 1rem; font-size: 0.95rem; color: #a4b3d8; letter-spacing: 0.08em; text-transform: uppercase; }
            .fullscreen-score-display .winner-text { font-size: 2.2rem; font-weight: 700; color: var(--accent); animation: pulse 1s infinite; line-height: 1.05; }
            .about-modal { display: none; position: fixed; inset: 0; background: rgba(2, 10, 26, 0.82); backdrop-filter: blur(8px); z-index: 1100; justify-content: center; align-items: center; padding: 1rem; }
            .about-modal.active { display: flex; }
            .about-modal-content { width: min(100%, 540px); background: rgba(9, 16, 34, 0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 1.5rem; box-shadow: var(--shadow); }
            .about-modal-content h2 { margin: 0 0 0.85rem; font-size: 1.45rem; }
            .about-modal-content p { margin: 0 0 1rem; color: #d7def8; line-height: 1.7; }
            .about-modal-content ul { margin: 0; padding-left: 1.2rem; color: #c9d3ef; }
            .about-modal-content li { margin-bottom: 0.6rem; }
            .about-modal-close { width: 100%; margin-top: 1rem; border: none; border-radius: 16px; padding: 0.9rem 1rem; background: var(--accent); color: #fff; cursor: pointer; font-weight: 700; }
            @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
            @media (max-width: 768px) {
                .board { width: 100%; padding: 0.7rem; }
                .players { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; }
                .player-card { padding: 0.5rem; min-height: 160px; }
                .player-card h1 { font-size: 0.75rem; }
                .score { font-size: 1rem; }
                .control-row { gap: 0.2rem; }
                .control-row button { font-size: 0.82rem; }
                .settings > div { flex-direction: column; align-items: stretch; }
                .settings label { width: 100%; max-width: 100%; text-align: left; }
                .settings select, .settings input { width: 100%; max-width: 100%; }
                .settings input { min-width: 0 !important; }
                .settings input, .settings select { min-width: 0; }
                #matchScoreDisplay { gap: 0.4rem; padding: 0.65rem 0.45rem; }
                .match-player-score { gap: 0.3rem; }
                .match-player-score span { max-width: 7rem; font-size: 0.8rem; }
                .match-player-score strong { font-size: 1.15rem; }
                .fullscreen-player-scores { gap: 0.45rem; }
                .fullscreen-player-score { padding: 0.55rem 0.6rem; }
                .fullscreen-player-score strong { font-size: 1.4rem; }
                .full-controls { flex-direction: column; align-items: stretch; }
                .scoring-card { padding: 0.8rem; }
                #matchScoreDisplay { min-width: 0; max-width: 100%; font-size: 1.1rem; box-sizing: border-box; }
                .player-header { flex-direction: column; align-items: center; }
                .player-header h1 { text-align: center; }
                .edit-btn { width: 100%; max-width: 120px; }
                .status { font-size: 0.8rem; }
                .fullscreen-score { gap: 0.9rem; padding: 0.5rem; min-height: 100vh; }
                .fullscreen-score-display { width: 100%; max-width: 94vw; min-height: 50vh; padding: 1.6rem 1rem; margin: auto; overflow: hidden; }
                .fullscreen-score-display .winner-text { font-size: 1.85rem; }
                ol#historyList { max-height: 160px; font-size: 0.8rem; }
            }
        </style>
    </head>
    <body>
        <div class="board">
            <div id="fullscreenScore" class="fullscreen-score">
                <div class="fullscreen-score-display">
                    <div class="fullscreen-game-label" id="fullscreenGameLabel"></div>
                    <div class="fullscreen-player-scores" id="fullscreenPlayerScores"></div>
                    <div class="winner-text" id="fullscreenWinnerText"></div>
                </div>
            </div>

            <section class="head">
                <h1>🎱 Billiards Score Tracker</h1>
            </section>

            <section class="scoring-card" style="margin-bottom:1rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 1.35rem; text-align: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 18px 40px rgba(0,0,0,0.22); backdrop-filter: blur(12px);">
                <div class="score-section" style="margin-bottom:1rem;">
                    <div class="score-label" id="scoreLabelText" style="font-size:1.25rem; font-weight:700; color:#eef2ff; margin-bottom:.65rem; letter-spacing:0.02em;">Match score:</div>
                    <div id="matchScoreDisplay" class="score-value"></div>
                </div>
            </section> 

            <div class="players" id="players"></div>
            <div class="player-count-controls">
                <button id="removePlayer" type="button">Remove player</button>
                <button id="addPlayer" type="button">Add player</button>
            </div>

            <div class="status" id="statusMessage">Ready.</div>

            <div class="full-controls">
                <button id="resetMatch" class="danger">Reset Match</button>
                <button id="aboutButton" class="secondary">About</button>
            </div>

            <section class="settings" style="margin-bottom:0.4rem; margin-top:0.8rem;">
                <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; justify-content:space-between; padding:0.45rem 0;">
                    <label for="gameNameInput" style="color:#eef2ff; font-weight:700; font-size:0.95rem;">Game name:</label>
                    <select id="gameNameInput" style="padding:0.85rem 1rem; border-radius:16px; background: rgba(255,255,255,0.05); color:#eef2ff; border:1px solid rgba(255,255,255,0.12); font-size:0.95rem; min-width:260px; flex:1; max-width:100%;">
                        <option value="">Select a game</option>
                        <option value="Dynamic Pyramid">Dynamic Pyramid</option>
                        <option value="Combined Pyramid">Combined Pyramid</option>
                        <option value="Moskva">Moscow</option>
                        <option value="America">America</option>
                    </select>
                </div>
                <div class="lang-switcher" style="margin-top:0.75rem; justify-content:center;">
                    <button id="langEn">🇬🇧 English</button>
                    <button id="langUk">🇺🇦 Українська</button>
                </div>
            </section>

            <div id="aboutModal" class="about-modal" aria-hidden="true">
                <div class="about-modal-content" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
                    <h2 id="aboutTitle">About</h2>
                    <p id="aboutDescription">A lightweight billiards score tracker with localized UI and match controls.</p>
                    <ul>
                        <li id="aboutFeature1">Track match score with quick +1 / -1 buttons.</li>
                        <li id="aboutFeature2">Switch between English and Ukrainian interface text.</li>
                        <li id="aboutFeature3">Save player names, game selection, and match progress.</li>
                    </ul>
                    <button id="aboutCloseButton" class="about-modal-close">Close</button>
                </div>
            </div>
        </div>

        <script>
const STORAGE_KEY = 'billiards-score-tracker-v1';
const DEFAULT_STATE = {
    players: [
        { name: 'Я', score: 0 },
        { name: 'Соперник', score: 0 }
    ],
    gameName: '',
    language: 'en',
    statusMessage: 'Ready.'
};

// Return the visible label for the currently selected game ID.
// This keeps the app display language-specific while storing a stable internal value.
function getCurrentGameLabel() {
    const lang = state.language || 'en';
    const options = translations[lang] && translations[lang].gameOptions;
    if (!Array.isArray(options)) return state.gameName || '';
    const selected = options.find((opt) => opt.id === state.gameName);
    return selected ? selected.label : state.gameName || '';
}

// Normalize any saved or legacy game selection value into the current ID form.
// This allows old values like 'Moskva' or translated labels to still work.
function normalizeGameName(value) {
    if (!value) return '';
    const allOptions = Object.values(translations).flatMap(lang => lang.gameOptions || []);
    const found = allOptions.find(option => option.id === value || option.value === value || option.label === value);
    return found ? found.id : '';
}

// Translation dictionary for UI text and localized game option labels.
// The current app stores game selection by ID, and the label is shown in the selected language.
const translations = {
    en: {
        title: '🎱 Billiards Score Tracker',
        gameNameLabel: 'Game name:',
        selectGame: 'Select a game',
        gameOptions: [
            { id: 'dynamic', value: 'Dynamic Pyramid', label: 'Dynamic Pyramid' },
            { id: 'combined', value: 'Combined Pyramid', label: 'Combined Pyramid' },
            { id: 'moskva', value: 'Moskva', label: 'Moscow' },
            { id: 'america', value: 'America', label: 'America' },
            { id: 'kolhoz', value: 'Kolhoz', label: 'Kolhoz' }
        ],
        matchScore: 'Match score:',
        resetMatch: 'Reset Match',
        ready: 'Ready.',
        matchUpdated: 'Match score updated.',
        matchAdjusted: 'Match score adjusted.',
        matchReset: 'Match reset.',
        gameNameSet: (game) => `Game name set to "${game}".`,
        leading: (name) => `${name} is LEADING!`,
        playerLabel: (number) => `Player ${number}`,
        playerPlaceholder: (number) => `Enter Player ${number} name`,
        addPlayer: 'Add player',
        removePlayer: 'Remove player',
        languageEnglish: 'English',
        languageUkrainian: 'Українська',
        about: 'About',
        aboutTitle: 'About this app',
        aboutDescription: 'A compact billiards score tracker with local state persistence and fast score updates.',
        aboutFeature1: 'Track match score with quick +1 / -1 buttons.',
        aboutFeature2: 'Switch between English and Ukrainian interface text.',
        aboutFeature3: 'Save up to four player names, game selection, and match score.',
        close: 'Close'
    },
    uk: {
        title: '🎱 Трекер рахунку більярду',
        gameNameLabel: 'Назва гри:',
        selectGame: 'Оберіть гру',
        gameOptions: [
            { id: 'dynamic', value: 'Dynamic Pyramid', label: 'Динамічна піраміда' },
            { id: 'combined', value: 'Combined Pyramid', label: 'Комбінована піраміда' },
            { id: 'moskva', value: 'Moskva', label: 'Москва' },
            { id: 'america', value: 'America', label: 'Америка' },
            { id: 'kolhoz', value: 'Kolhoz', label: 'Колгосп' }
        ],
        matchScore: 'Рахунок матчу:',
        resetMatch: 'Скинути матч',
        ready: 'Готово.',
        matchUpdated: 'Рахунок матчу оновлено.',
        matchAdjusted: 'Рахунок налаштовано.',
        matchReset: 'Матч скинуто.',
        gameNameSet: (game) => `Назва гри: "${game}".`,
        leading: (name) => `${name} лідирує!`,
        playerLabel: (number) => `Гравець ${number}`,
        playerPlaceholder: (number) => `Введіть ім’я гравця ${number}`,
        addPlayer: 'Додати гравця',
        removePlayer: 'Прибрати гравця',
        languageEnglish: 'English',
        languageUkrainian: 'Українська',
        about: 'Про програму',
        aboutTitle: 'Про цю програму',
        aboutDescription: 'Компактний трекер рахунку більярду з локальним збереженням і швидким керуванням рахунком.',
        aboutFeature1: 'Відстежуйте рахунок матчу за допомогою кнопок +1 / -1.',
        aboutFeature2: 'Перемикайте інтерфейс між англійською та українською.',
        aboutFeature3: 'Зберігайте до чотирьох імен гравців, обрану гру та рахунок матчу.',
        close: 'Закрити'
    }
};

const state = {
    ...DEFAULT_STATE,
    players: DEFAULT_STATE.players.map(player => ({ ...player }))
};

function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return;
        Object.assign(state, DEFAULT_STATE, parsed);
        const savedPlayers = Array.isArray(parsed.players)
            ? parsed.players.filter(player => player && typeof player === 'object')
            : [
                { name: parsed.player1Name, score: parsed.player1MatchScore },
                { name: parsed.player2Name, score: parsed.player2MatchScore }
            ];
        state.players = savedPlayers.slice(0, 4).map((player, index) => ({
            name: typeof player.name === 'string'
                ? player.name
                : DEFAULT_STATE.players[index]?.name || '',
            score: Number.isFinite(player.score) ? Math.max(0, Math.floor(player.score)) : 0
        }));
        while (state.players.length < 2) {
            state.players.push({ name: '', score: 0 });
        }
        // Convert any stored game value into the proper internal game ID.
        state.gameName = normalizeGameName(state.gameName);
    } catch (error) {
        console.warn('Could not load saved state:', error);
    }
}

function toggleAboutModal(show) {
    const modal = document.getElementById('aboutModal');
    if (!modal) return;
    modal.classList.toggle('active', show);
    modal.setAttribute('aria-hidden', show ? 'false' : 'true');
}

// Translation helper. Supports both string values and functions for dynamic text.
function t(key, ...args) {
    const lang = state.language || 'en';
    const translation = translations[lang] && translations[lang][key];
    if (typeof translation === 'function') {
        return translation(...args);
    }
    return translation || key;
}

function setStatus(text) {
    state.statusMessage = text;
    const statusEl = document.getElementById('statusMessage');
    if (statusEl) statusEl.textContent = text;
}

function getPlayerName(player, index) {
    return player.name || t('playerLabel', index + 1);
}

function createPlayerCard(player, index) {
    const card = document.createElement('div');
    card.className = 'player-card';

    const header = document.createElement('div');
    header.className = 'player-header';
    const title = document.createElement('h1');
    title.textContent = getPlayerName(player, index);
    const editButton = document.createElement('button');
    editButton.type = 'button';
    editButton.className = 'edit-btn';
    editButton.title = 'Edit name';
    editButton.textContent = '✏️';
    editButton.dataset.action = 'edit';
    editButton.dataset.index = index;
    header.append(title, editButton);

    const input = document.createElement('input');
    input.type = 'text';
    input.value = player.name;
    input.placeholder = t('playerPlaceholder', index + 1);
    input.autocomplete = 'off';
    input.style.display = 'none';
    input.dataset.playerName = index;

    const controls = document.createElement('div');
    controls.className = 'control-row';
    const addButton = document.createElement('button');
    addButton.type = 'button';
    addButton.className = 'accent';
    addButton.textContent = '+1';
    addButton.dataset.action = 'add-score';
    addButton.dataset.index = index;
    addButton.dataset.points = 1;
    const subtractButton = document.createElement('button');
    subtractButton.type = 'button';
    subtractButton.className = 'secondary';
    subtractButton.textContent = '-1';
    subtractButton.dataset.action = 'subtract-score';
    subtractButton.dataset.index = index;
    subtractButton.dataset.points = 1;
    const addTenButton = document.createElement('button');
    addTenButton.type = 'button';
    addTenButton.className = 'accent';
    addTenButton.textContent = '+10';
    addTenButton.dataset.action = 'add-score';
    addTenButton.dataset.index = index;
    addTenButton.dataset.points = 10;
    const subtractTenButton = document.createElement('button');
    subtractTenButton.type = 'button';
    subtractTenButton.className = 'secondary';
    subtractTenButton.textContent = '-10';
    subtractTenButton.dataset.action = 'subtract-score';
    subtractTenButton.dataset.index = index;
    subtractTenButton.dataset.points = 10;
    controls.append(addButton, subtractButton, addTenButton, subtractTenButton);
    card.append(header, input, controls);
    return card;
}

function updateView() {
    // Render all localized UI text and current state values.
    document.querySelector('.head h1').textContent = t('title');
    const playersEl = document.getElementById('players');
    playersEl.replaceChildren(...state.players.map(createPlayerCard));
    const addPlayerButton = document.getElementById('addPlayer');
    const removePlayerButton = document.getElementById('removePlayer');
    addPlayerButton.textContent = t('addPlayer');
    addPlayerButton.disabled = state.players.length >= 4;
    removePlayerButton.textContent = t('removePlayer');
    removePlayerButton.disabled = state.players.length <= 2;

    // Update score label with game name if selected
    const scoreLabel = state.gameName ? getCurrentGameLabel() : t('matchScore');
    document.getElementById('scoreLabelText').textContent = scoreLabel;

    const matchScoreDisplay = document.getElementById('matchScoreDisplay');
    matchScoreDisplay.replaceChildren(...state.players.map((player, index) => {
        const score = document.createElement('div');
        score.className = 'match-player-score';
        const name = document.createElement('span');
        name.textContent = getPlayerName(player, index);
        const value = document.createElement('strong');
        value.textContent = player.score;
        score.append(name, value);
        return score;
    }));

    const gameNameLabelEl = document.querySelector('label[for="gameNameInput"]');
    if (gameNameLabelEl) {
        gameNameLabelEl.textContent = t('gameNameLabel');
    }
    // Rebuild the game dropdown options on each view update so the labels stay localized.

    const gameNameSelectEl = document.getElementById('gameNameInput');
    if (gameNameSelectEl) {
        gameNameSelectEl.innerHTML = '';
        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = t('selectGame');
        gameNameSelectEl.appendChild(emptyOption);

        const options = t('gameOptions');
        if (Array.isArray(options)) {
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option.id;
                opt.textContent = option.label;
                gameNameSelectEl.appendChild(opt);
            });
        }
        gameNameSelectEl.value = state.gameName || '';
    }

    const resetMatchBtn = document.getElementById('resetMatch');
    if (resetMatchBtn) {
        resetMatchBtn.textContent = t('resetMatch');
    }
    const aboutBtn = document.getElementById('aboutButton');
    if (aboutBtn) {
        aboutBtn.textContent = t('about');
    }
    document.getElementById('aboutTitle').textContent = t('aboutTitle');
    document.getElementById('aboutDescription').textContent = t('aboutDescription');
    document.getElementById('aboutFeature1').textContent = t('aboutFeature1');
    document.getElementById('aboutFeature2').textContent = t('aboutFeature2');
    document.getElementById('aboutFeature3').textContent = t('aboutFeature3');
    document.getElementById('aboutCloseButton').textContent = t('close');

    setStatus(state.statusMessage || t('ready'));

    const langEnButton = document.getElementById('langEn');
    const langUkButton = document.getElementById('langUk');
    if (langEnButton && langUkButton) {
        langEnButton.classList.toggle('active', state.language === 'en');
        langUkButton.classList.toggle('active', state.language === 'uk');
    }

    updateFullscreenScore();
}

function applyMatchPoint(playerIndex, points = 1) {
    state.players[playerIndex].score += points;
    setStatus(t('matchUpdated'));
    saveState();
    updateView();
}

function applyMatchSubtraction(playerIndex, points = 1) {
    state.players[playerIndex].score = Math.max(0, state.players[playerIndex].score - points);
    setStatus(t('matchAdjusted'));
    saveState();
    updateView();
}

function resetMatch() {
    state.players.forEach(player => {
        player.score = 0;
    });
    setStatus(t('matchReset'));
    saveState();
    updateView();
}

function updateFullscreenScore() {
    const fullscreenPlayers = document.getElementById('fullscreenPlayerScores');
    fullscreenPlayers.replaceChildren(...state.players.map((player, index) => {
        const score = document.createElement('div');
        score.className = 'fullscreen-player-score';
        const name = document.createElement('span');
        name.textContent = getPlayerName(player, index);
        const value = document.createElement('strong');
        value.textContent = player.score;
        score.append(name, value);
        return score;
    }));
    const currentGameLabel = state.gameName ? getCurrentGameLabel() : '';
    document.getElementById('fullscreenGameLabel').textContent = currentGameLabel;
    const highestScore = Math.max(...state.players.map(player => player.score));
    const leaders = state.players.filter(player => player.score === highestScore);
    const winnerText = highestScore > 0 && leaders.length === 1
        ? t('leading', getPlayerName(leaders[0], state.players.indexOf(leaders[0])))
        : '';
    document.getElementById('fullscreenWinnerText').textContent = winnerText;
}

function bindEvents() {
    // Wire up all UI interactions once, then keep the state in sync.
    const playersEl = document.getElementById('players');
    playersEl.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const playerIndex = Number(button.dataset.index);
        if (button.dataset.action === 'edit') {
            const input = playersEl.querySelector(`[data-player-name="${playerIndex}"]`);
            input.style.display = 'block';
            input.focus();
            input.select();
        } else if (button.dataset.action === 'add-score') {
            applyMatchPoint(playerIndex, Number(button.dataset.points));
        } else if (button.dataset.action === 'subtract-score') {
            applyMatchSubtraction(playerIndex, Number(button.dataset.points));
        }
    });

    playersEl.addEventListener('focusout', (event) => {
        const input = event.target.closest('input[data-player-name]');
        if (!input) return;
        const playerIndex = Number(input.dataset.playerName);
        state.players[playerIndex].name = input.value.trim();
        saveState();
        setTimeout(updateView, 0);
    });

    playersEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.target.matches('input[data-player-name]')) {
            event.target.blur();
        }
    });

    document.getElementById('addPlayer').addEventListener('click', () => {
        if (state.players.length >= 4) return;
        state.players.push({ name: '', score: 0 });
        setStatus(t('ready'));
        saveState();
        updateView();
    });

    document.getElementById('removePlayer').addEventListener('click', () => {
        if (state.players.length <= 2) return;
        state.players.pop();
        setStatus(t('ready'));
        saveState();
        updateView();
    });

    const gameNameSelect = document.getElementById('gameNameInput');
    if (gameNameSelect) {
        gameNameSelect.addEventListener('change', (ev) => {
            state.gameName = ev.target.value;
            setStatus(t('gameNameSet', getCurrentGameLabel()));
            saveState();
            updateView();
        });
    }

    const langEnButton = document.getElementById('langEn');
    if (langEnButton) {
        langEnButton.addEventListener('click', () => {
            state.language = 'en';
            state.statusMessage = t('ready');
            saveState();
            updateView();
        });
    }
    const langUkButton = document.getElementById('langUk');
    if (langUkButton) {
        langUkButton.addEventListener('click', () => {
            state.language = 'uk';
            state.statusMessage = t('ready');
            saveState();
            updateView();
        });
    }

    document.getElementById('resetMatch').addEventListener('click', resetMatch);
    const aboutButton = document.getElementById('aboutButton');
    if (aboutButton) {
        aboutButton.addEventListener('click', () => toggleAboutModal(true));
    }
    const aboutCloseButton = document.getElementById('aboutCloseButton');
    if (aboutCloseButton) {
        aboutCloseButton.addEventListener('click', () => toggleAboutModal(false));
    }
    const aboutModal = document.getElementById('aboutModal');
    if (aboutModal) {
        aboutModal.addEventListener('click', (event) => {
            if (event.target === aboutModal) {
                toggleAboutModal(false);
            }
        });
    }

    // Toggle fullscreen score view
    document.getElementById('matchScoreDisplay').addEventListener('click', () => {
        const fullscreenEl = document.getElementById('fullscreenScore');
        fullscreenEl.classList.toggle('active');
        updateFullscreenScore();
    });

    document.getElementById('fullscreenScore').addEventListener('click', (e) => {
        if (e.target.id === 'fullscreenScore') {
            e.target.classList.remove('active');
        }
    });
}

function init() {
    loadState();
    bindEvents();
    updateView();
}

window.addEventListener('DOMContentLoaded', init);
        </script>
    </body>
</html>
